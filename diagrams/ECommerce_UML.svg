<text x="40.0" y="30.0" font-size="21" text-anchor="start" fill="#0f172a" font-weight="bold">ASSIGNMENT 1 / UML CLASS DIAGRAM</text>
<text x="40.0" y="52.0" font-size="12.5" text-anchor="start" fill="#64748b">Overview: classes, attributes and relationships</text>
<text x="40.0" y="880.0" font-size="11.5" text-anchor="start" fill="#475569">"-" private, "+" public  |  hollow triangle = inheritance (IS-A)</text>
<text x="40.0" y="899.0" font-size="11.5" text-anchor="start" fill="#475569">hollow diamond = aggregation  |  filled diamond = composition</text>
<text x="40.0" y="918.0" font-size="11.5" text-anchor="start" fill="#475569">solid line + open arrow = association (kept in a field)</text>
<text x="40.0" y="937.0" font-size="11.5" text-anchor="start" fill="#475569">dashed arrow = dependency (parameter, local variable, return type)</text>
<text x="40.0" y="956.0" font-size="11.5" text-anchor="start" fill="#475569">Not drawn: Main also uses Customer, Employee, Product, Order;</text>
<text x="40.0" y="975.0" font-size="11.5" text-anchor="start" fill="#475569">Store also creates Book, Electronics, Clothing, Customer, Employee.</text>
